name: Algo deu errado
description: Conte um erro ou comportamento estranho do app.
labels: [erro]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tela…
        2. Clique em…
  - type: input
    id: versao
    attributes:
      label: Versão do Git Arbor
      description: Em Conta e ajustes, no fim da tela.
  - type: input
    id: macos
    attributes:
      label: Versão do macOS
